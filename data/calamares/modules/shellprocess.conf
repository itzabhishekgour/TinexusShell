# ==============================================================================
# Tinexus OS — Calamares shellprocess post-installation module
# Finalizes target systemd services, audio priorities, and GRUB fallback entries
# ==============================================================================
---
dontChroot: false
timeout: 120
script:
  # 1. Enable standard Tinexus desktop targets in systemd
  - command: "systemctl set-default graphical.target"
  - command: "systemctl enable tinexus-serviced.service 2>/dev/null || true"
  
  # 2. Preserve universal Intel DSP / SOF audio priority configuration
  - command: "mkdir -p /etc/modprobe.d && echo -e 'options snd-intel-dspcfg dsp_driver=0\nsoftdep snd_hda_intel pre: snd_sof_pci_intel_cnl snd_sof_pci_intel_icl snd_sof_pci_intel_tgl snd_sof_pci_intel_mtl snd_sof_intel_hda_generic\nsoftdep snd_sof_intel_hda_generic pre: snd_soc_hdac_hda snd_soc_skl_hda_dsp' > /etc/modprobe.d/sof-priority.conf"

  # 3. Generate systemd machine-id if missing
  - command: "systemd-machine-id-setup"

  # 4. Configure GRUB default command line with quiet splash and update grub
  - command: "sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT=\"quiet splash\"/' /etc/default/grub 2>/dev/null || true"
  - command: "update-grub 2>/dev/null || true"
