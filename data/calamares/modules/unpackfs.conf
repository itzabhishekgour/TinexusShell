# ==============================================================================
# Tinexus OS — Calamares unpackfs module configuration
# Extracts live SquashFS image/mount into the target installation root
# ==============================================================================
---
unpack:
    -   source: "/rofs"
        sourcefs: "file"
        destination: ""
    -   source: "/run/live/medium/live/rootfs.squashfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/live/rootfs.squashfs"
        sourcefs: "squashfs"
        destination: ""
