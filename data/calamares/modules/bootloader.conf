# ==============================================================================
# Tinexus OS — Calamares bootloader module configuration
# ==============================================================================
---
efiBootLoader:          "grub"
kernel:                 "/boot/vmlinuz"
img:                    "/boot/initrd.img"
fallback:               "/boot/initrd.img"
timeout:                "2"

grubInstall:            "grub-install"
grubTarget:             "x86_64-efi"
grubEfiDirectory:       "/boot/efi"
bootloaderId:           "Tinexus"
installEpoxy:           true

# When running in BIOS mode, fallback to MBR
grubInstallBios:        "grub-install"
